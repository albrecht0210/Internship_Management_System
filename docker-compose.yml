version: '3.8'

services:
  django:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./ssl-certs:/app/ssl-certs  # Mount SSL certs into the container
    environment:
      - DJANGO_SETTINGS_MODULE=your_project.settings

  react:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./ssl-certs:/app/ssl-certs  # Mount SSL certs into the container
    environment:
      - NODE_ENV=development

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    build:
      context: ./nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./ssl-certs:/etc/ssl/certs  # Mount SSL certs into the container
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - django
      - react
      
volumes:
  postgres_data: